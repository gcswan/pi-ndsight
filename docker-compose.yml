# Hindsight memory server for pi-ndsight.
#
# The extension starts this automatically via `docker compose up -d`, passing
# configuration through the environment variables below (resolved from the
# setup wizard or your shell). You can also run it by hand:
#
#   HINDSIGHT_API_LLM_API_KEY=sk-... docker compose up -d
#
# Data persists in HINDSIGHT_DATA_DIR (default ~/hindsight-data), so the
# container can be recreated without losing memories.
services:
  pindsight:
    image: ${HINDSIGHT_IMAGE:-ghcr.io/vectorize-io/hindsight:0.7.2}
    container_name: pindsight
    # The embedded Postgres builds a to_tsvector GENERATED column during
    # migrations, which needs >500MB of shared memory. Docker's default 64MB
    # /dev/shm causes DiskFull crashes on first start / upgrade. Give it room.
    shm_size: 2gb
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-groq}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-openai/gpt-oss-20b}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL:-}
      # Groq free tier: set to on_demand if you hit service_tier errors.
      HINDSIGHT_API_LLM_GROQ_SERVICE_TIER: ${HINDSIGHT_API_LLM_GROQ_SERVICE_TIER:-}
    volumes:
      - ${HINDSIGHT_DATA_DIR:-/tmp/hindsight-data}:/home/hindsight/.pg0
    restart: unless-stopped
